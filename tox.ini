[tox]
requires = tox-uv
envlist = python310

[testenv:python311]

[testenv:python312]

[testenv:python313]

[testenv:python314]

[testenv]
# The gate installs the committed uv.lock verbatim via --frozen, so it never
# re-resolves and an upstream release cannot break CI with no repo change.
# --locked is deliberately not used: it asserts the lock is the newest possible
# resolution, which a rolling exclude-newer window makes non-deterministic.
# A genuinely stale lock is therefore not caught here; refresh it explicitly.
runner = uv-venv-lock-runner
uv_sync_locked = false
uv_sync_flags = --frozen
extras = dev
passenv =
    USE_TOX_LOCK
    PYTEST_WORKERS
allowlist_externals = sh, bandit
setenv =
    USE_TOX_LOCK = {env:USE_TOX_LOCK:}
# The explicit bandit -x replaces the bare built-in defaults, which substring-match every path containing them.
commands =
    sh -c "if [ -n \"$USE_TOX_LOCK\" ]; then flock /shared/tox.lock pytest -n {env:PYTEST_WORKERS:2}; else pytest -n {env:PYTEST_WORKERS:2}; fi"
    ruff format --check --line-length 120 .
    ruff check .
    mypy --strict --ignore-missing-imports .
    bandit -c pyproject.toml -r -q -x .svn/*,*/.svn/*,CVS/*,*/CVS/*,.bzr/*,*/.bzr/*,.hg/*,*/.hg/*,.git/*,*/.git/*,__pycache__/*,*/__pycache__/*,.tox/*,*/.tox/*,.eggs/*,*/.eggs/*,*.egg,*.egg/* .

[testenv:testing]
description = Run only mloda-testing tests
usedevelop = true
commands =
    pytest mloda/testing/tests/ -v -n 2

[testenv:community-example]
description = Run only mloda-community-example tests
usedevelop = true
commands =
    pytest mloda/community/feature_groups/example/tests/ -v -n 2

[testenv:community-example-a]
description = Run only mloda-community-example-a tests
usedevelop = true
commands =
    pytest mloda/community/feature_groups/example/example_a/tests/ -v -n 2

[testenv:community-example-b]
description = Run only mloda-community-example-b tests
usedevelop = true
commands =
    pytest mloda/community/feature_groups/example/example_b/tests/ -v -n 2

[testenv:registry]
description = Run only mloda-registry tests
usedevelop = true
commands =
    pytest mloda/registry/tests/ -v -n 2

[testenv:enterprise-example]
description = Run only mloda-enterprise-example tests
usedevelop = true
commands =
    pytest mloda/enterprise/ -v -n 2

[testenv:lint-docs]
description = Check docs for broken links/imports and plugin source for raw-dict PROPERTY_MAPPING
# Needs skip_install, which the lock runner ignores.
runner = uv-venv-runner
skip_install = true
commands =
    python scripts/lint_docs.py

[testenv:verify-builds]
description = Verify all packages build with correct versions
# Needs deps, which the lock runner ignores.
runner = uv-venv-runner
usedevelop = true
extras = dev
deps = setuptools
allowlist_externals = uv
commands =
    python scripts/verify_builds.py

[testenv:verify-build-floor]
description = Verify packages build at the declared setuptools floor
# Needs deps, which the lock runner ignores.
runner = uv-venv-runner
usedevelop = true
extras = dev
deps = setuptools
allowlist_externals = uv
commands =
    python scripts/verify_build_floor.py

[testenv:check-generated]
description = Check pyproject.toml files are up-to-date with config
usedevelop = true
extras = dev
commands =
    python scripts/generate_pyproject.py --check

[testenv:verify-published]
description = Verify published packages install and import correctly
# Needs deps and skip_install, which the lock runner ignores.
runner = uv-venv-runner
skip_install = true
# tomli: nothing else here provides it, and Python 3.10 has no tomllib.
deps =
    tomli
allowlist_externals = sh
commands =
    sh -c 'uv cache clean'
    sh -c 'rm -rf /tmp/mloda-verify && uv venv /tmp/mloda-verify'
    sh -c 'VIRTUAL_ENV=/tmp/mloda-verify uv pip install $(python scripts/published_packages.py --pin {env:MLODA_REGISTRY_VERSION})'
    python scripts/verify_published_imports.py /tmp/mloda-verify/bin/python

[testenv:verify-floor-installs]
description = Verify each package's import surface loads with its internal dependency pinned to the declared floor
# Needs deps and skip_install, which the lock runner ignores.
runner = uv-venv-runner
skip_install = true
# tomli: nothing else here provides it, and Python 3.10 has no tomllib.
deps =
    tomli
allowlist_externals = uv
commands =
    python scripts/verify_floor_installs.py {env:MLODA_REGISTRY_VERSION}

[testenv:verify-typed-install]
description = Verify a standalone leaf install is typed under mypy --strict
# Needs skip_install, which the lock runner ignores.
runner = uv-venv-runner
skip_install = true
allowlist_externals = uv
commands =
    python scripts/verify_typed_install.py {env:MLODA_REGISTRY_VERSION}

[testenv:verify-extras]
description = Verify optional dependencies install correctly
# Needs deps and skip_install, which the lock runner ignores.
runner = uv-venv-runner
skip_install = true
# tomli: nothing else here provides it, and Python 3.10 has no tomllib.
deps =
    tomli
commands =
    python scripts/verify_extras.py {env:MLODA_REGISTRY_VERSION}

[testenv:verify-published-independent]
description = Verify each package installs and imports independently
# Needs deps and skip_install, which the lock runner ignores.
runner = uv-venv-runner
skip_install = true
# tomli: nothing else here provides it, and Python 3.10 has no tomllib.
deps =
    tomli
commands =
    python scripts/verify_independent_installs.py {env:MLODA_REGISTRY_VERSION}

[testenv:security]
description = CVE scanning of published packages
# Needs deps and skip_install, which the lock runner ignores.
runner = uv-venv-runner
skip_install = true
# tomli: nothing else here provides it, and Python 3.10 has no tomllib.
deps =
    pip-audit
    tomli
allowlist_externals = sh, mkdir, uv
commands =
    mkdir -p security-reports
    sh -c "uv pip uninstall $(python scripts/published_packages.py) 2>/dev/null || true"
    sh -c 'uv pip install $(python scripts/published_packages.py --pin {env:MLODA_REGISTRY_VERSION})'
    sh -c "pip-audit --desc --format=json --output=security-reports/pip-audit.json || pip-audit --desc"
    sh -c "echo '=== CVE Scan Complete ==='"
    sh -c "echo 'Report: security-reports/pip-audit.json'"
