# Package-specific configuration for mloda-registry packages
# Edit this file and run: python scripts/generate_pyproject.py
#
# published = true is the single source of the released set, read through
# scripts/published_packages.py. Without it a package ships only inside the
# mloda-community / mloda-enterprise bundle wheels.

[packages.mloda-registry]
description = "Plugin discovery and search for mloda"
dependencies = ["{core_dependency}"]
path = "mloda/registry"
published = true
py_typed = true

[packages.mloda-testing]
description = "Test utilities for mloda plugin development"
dependencies = ["{core_dependency}", "pytest>=9.0.3"]
path = "mloda/testing"
published = true
optional_dependencies = { dev = ["pytest>=9.0.3"], binary-model = ["pyarrow>=25"] }
py_typed = true

[packages.mloda-community]
description = "All community plugins for mloda"
dependencies = ["{core_dependency}"]
path = "mloda/community"
published = true
entry_point_bundle = true
py_typed = true

[packages.mloda-enterprise]
description = "All enterprise plugins for mloda (License required: https://mloda.ai/enterprise)"
# mloda-community floor: the binary example subclasses the community binary-model mixin, and a manifest
# import that fails on a missing mloda.community module aborts plugin discovery. Bump the floor to the
# first release shipping mloda/community/feature_groups/binary_model once it is published.
dependencies = ["{core_dependency}", "mloda-community>=0.4.5"]
path = "mloda/enterprise"
published = true
entry_point_bundle = true
py_typed = true

[packages.mloda-community-example]
description = "Example community FeatureGroup plugin for mloda"
dependencies = ["{core_dependency}"]
path = "mloda/community/feature_groups/example"
published = true
optional_dependencies = { all = ["mloda-community-example-a", "mloda-community-example-b"] }
entry_point_groups = ["mloda.feature_groups"]
py_typed = true

[packages.mloda-enterprise-example]
description = "Example enterprise FeatureGroup plugin for mloda"
dependencies = ["{core_dependency}"]
path = "mloda/enterprise/feature_groups/example"
entry_point_groups = ["mloda.feature_groups"]

# --- Binary model ---
# The mixin ships in the community bundle, the example in the enterprise bundle; neither is published
# standalone yet. mloda-testing[binary-model] (the simulated binary and the conformance kit) is a dev
# dependency only: nothing under mloda/community or mloda/enterprise imports mloda.testing at runtime.

[packages.mloda-community-binary-model]
description = "Mixin running an external binary as a model over Arrow IPC, the base for binary-backed FeatureGroups"
dependencies = ["{core_dependency}"]
path = "mloda/community/feature_groups/binary_model"
optional_dependencies = { pyarrow = ["pyarrow>=25"], dev = ["mloda-testing[binary-model]", "pytest>=9.0.3"] }

[packages.mloda-enterprise-binary-example]
description = "Example enterprise FeatureGroup backed by a licensed binary model"
dependencies = ["mloda-community-binary-model"]
path = "mloda/enterprise/feature_groups/binary_example"
optional_dependencies = { dev = ["mloda-testing[binary-model]", "pytest>=9.0.3"] }
entry_point_groups = ["mloda.feature_groups"]

[packages.mloda-community-example-a]
description = "Example A FeatureGroup extending community example base"
# Floor 0.4.1: first release of mloda-community-example shipping the py.typed marker.
dependencies = ["mloda-community-example>=0.4.1"]
path = "mloda/community/feature_groups/example/example_a"
published = true
entry_point_groups = ["mloda.feature_groups"]

[packages.mloda-community-example-b]
description = "Example B FeatureGroup extending community example base"
dependencies = ["mloda-community-example>=0.4.1"]
path = "mloda/community/feature_groups/example/example_b"
entry_point_groups = ["mloda.feature_groups"]

[packages.mloda-community-compute-frameworks-example]
description = "Example community ComputeFramework plugin for mloda"
dependencies = ["{core_dependency}"]
path = "mloda/community/compute_frameworks/example"
entry_point_groups = ["mloda.compute_frameworks"]

[packages.mloda-community-extenders-example]
description = "Example community Extender plugin for mloda"
dependencies = ["{core_dependency}"]
path = "mloda/community/extenders/example"
entry_point_groups = ["mloda.extenders"]

[packages.mloda-enterprise-compute-frameworks-example]
description = "Example enterprise ComputeFramework plugin for mloda"
dependencies = ["{core_dependency}"]
path = "mloda/enterprise/compute_frameworks/example"
entry_point_groups = ["mloda.compute_frameworks"]

[packages.mloda-enterprise-extenders-example]
description = "Example enterprise Extender plugin for mloda"
dependencies = ["{core_dependency}"]
path = "mloda/enterprise/extenders/example"
entry_point_groups = ["mloda.extenders"]

