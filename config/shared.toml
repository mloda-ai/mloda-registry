# Shared configuration for all mloda-registry packages
# Edit this file and run: python scripts/generate_pyproject.py

[project]
version = "0.11.0"
requires-python = ">=3.11,<3.15"
authors = [{ name = "Tom Kaltofen", email = "info@mloda.ai" }]
keywords = ["mloda", "mloda-plugin"]
# No License classifier: the SPDX `license` string is emitted and setuptools rejects both.
classifiers = [
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

[project.urls]
Homepage = "https://mloda.ai"
Repository = "https://github.com/mloda-ai/mloda-registry"

[build-system]
# 77.0.1 is the first release accepting the PEP 639 SPDX license string the generator emits.
requires = ["setuptools>=77.0.1"]
build-backend = "setuptools.build_meta"

[defaults]
license = "Apache-2.0"
core_dependency = "mloda>=0.18.0,<0.19.0"
optional_dependencies = { dev = ["mloda-testing", "pytest>=9.0.3"] }
