name: Commit Lint

# @semantic-release/commit-analyzer (.releaserc.yaml) silently ignores malformed commit messages
# instead of erroring, so this catches them before merge. No paths-ignore: docs-only PRs still
# need a conforming commit.
on:
  pull_request:
    branches: [ "main", "feat/binary-model" ]
    types: [ opened, synchronize, reopened, edited ]

permissions:
  contents: read

jobs:
  commit-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate commit messages follow Conventional Commits
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -u
          : "${BASE_SHA:?}" "${HEAD_SHA:?}"
          # Types kept in sync with the commit-analyzer releaseRules in .releaserc.yaml. A bare
          # "revert: ..." header isn't in that list, so it's rejected here too; only GitHub's own
          # generated `Revert "..."` form (with a `This reverts commit <sha>.` body) is release-
          # triggering via commit-analyzer's default rule, so only that form is accepted.
          pattern='^(Revert "|(minor|feat|impr|refactor|perf|fix|ci|docs|chore|style|test|build)(\([^)]+\))?!?: ).+$'
          failed=0
          check() {
            if ! [[ "$2" =~ $pattern ]]; then
              echo "::error ::$1 does not follow Conventional Commits (see .releaserc.yaml): $2"
              failed=1
            fi
          }
          # Squash merges land the PR title, not the individual commits, as the subject
          # semantic-release actually parses; merge and rebase merges (both allowed here) land
          # every individual commit verbatim instead. Check both to cover all three paths.
          check "PR title" "$PR_TITLE"
          range_base=$(git merge-base "$BASE_SHA" "$HEAD_SHA") || {
            echo "::error ::git merge-base failed for $BASE_SHA and $HEAD_SHA"
            exit 1
          }
          subjects=$(git log --no-merges --format=%s "$range_base..$HEAD_SHA") || {
            echo "::error ::git log failed for range $range_base..$HEAD_SHA"
            exit 1
          }
          while IFS= read -r subject; do
            [ -z "$subject" ] && continue
            check "Commit message" "$subject"
          done <<< "$subjects"
          exit "$failed"
