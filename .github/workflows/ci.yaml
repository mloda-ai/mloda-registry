name: CI

on:
  push:
    branches: [ "main", "feat/binary-model" ]
  pull_request:
    branches: [ "main", "feat/binary-model" ]

permissions:
  contents: read

jobs:
  build:

    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - python-version: "3.10"
            toxenv: python310
          - python-version: "3.11"
            toxenv: python311
          - python-version: "3.12"
            toxenv: python312
          - python-version: "3.13"
            toxenv: python313
          - python-version: "3.14"
            toxenv: python314

    steps:
    - uses: actions/checkout@v4
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install tox
      run: |
        python -m pip install --upgrade pip
        # Pinned: uv reads the committed uv.lock, and a lockfile serialization change across minors invalidates it.
        python -m pip install "uv>=0.12,<0.13"
        uv tool install tox --with tox-uv
    - name: Run tox
      run: tox -e ${{ matrix.toxenv }}
      timeout-minutes: 3
      env:
        PYTEST_WORKERS: "2"

  lint-docs:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"
    - name: Install tox
      run: |
        python -m pip install --upgrade pip
        # Pinned: uv reads the committed uv.lock, and a lockfile serialization change across minors invalidates it.
        python -m pip install "uv>=0.12,<0.13"
        uv tool install tox --with tox-uv
    - name: Lint docs
      run: tox -e lint-docs

  # Platforms the wrapper's CI run-tests natively; linux-aarch64 is out (the wrapper only smoke-tests it under emulation).
  # The wheel is the PyPI release pinned in uv.lock, so no secret is needed.
  real-wheel:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15-intel, macos-15, windows-2022]
    steps:
    - uses: actions/checkout@v4
      with:
        persist-credentials: false
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"
    - name: Install tox
      run: |
        python -m pip install --upgrade pip
        # Pinned: uv reads the committed uv.lock, and a lockfile serialization change across minors invalidates it.
        python -m pip install "uv>=0.12,<0.13"
        uv tool install tox --with tox-uv
        # uv's tool bin dir is not on PATH on every runner image
        uv tool dir --bin >> "$GITHUB_PATH"
    - name: Test against the real wheel
      run: tox -e real-wheel
      # cryptography has no Intel macOS wheel, so that leg builds it from sdist
      timeout-minutes: 10
