name: Release

on:
  workflow_dispatch:

jobs:
  github_release:
    name: GitHub Release
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    outputs:
      new_release_version: ${{ steps.semantic.outputs.new_release_version }}
      new_release_published: ${{ steps.semantic.outputs.new_release_published }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install tomli

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "lts/*"

      - name: Install semantic release and plugins
        run: |
          npm install -g semantic-release@v24.2.1 \
            conventional-changelog-cli \
            conventional-changelog-conventionalcommits@9.3.1 \
            @semantic-release/changelog \
            @semantic-release/exec \
            @semantic-release/git \
            @semantic-release/github

      - name: Semantic Release Dry Run
        id: semantic
        run: |
          dry_run_output=$(semantic-release --dry-run 2>&1 || true)

          echo "$dry_run_output"

          # Check if there are no changes
          if [[ "$dry_run_output" == *"no new version is released"* ]]; then
            echo "No new release needed"
            echo "new_release_published=false" >> $GITHUB_OUTPUT
            exit 0
          fi

          # Extract version from dry run output
          version=$(echo "$dry_run_output" | grep -oP "The next release version is \K[0-9]+\.[0-9]+\.[0-9]+")
          if [ -z "$version" ]; then
            echo "::error ::Could not determine version"
            exit 1
          fi

          echo "new_release_version=$version" >> $GITHUB_OUTPUT

          # Run actual release
          if semantic-release; then
            echo "Release successful"
            echo "new_release_published=true" >> $GITHUB_OUTPUT
          else
            echo "Release failed"
            exit 1
          fi
        env:
          CI: true
          GITHUB_TOKEN: ${{ secrets.SEMANTIC_RELEASE_TOKEN }}

  publish:
    needs: github_release
    if: needs.github_release.outputs.new_release_published == 'true'
    runs-on: ubuntu-24.04
    steps:
      - name: Check out the code
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: main

      - name: Fetch changes on main
        run: git pull origin main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install uv twine setuptools tomli

      - name: Build packages
        run: |
          # Released set: whatever config/packages.toml flags published = true.
          # Capture before splitting: a process substitution hides the producer's exit status,
          # and the emptiness check needs the string, since `mapfile <<< ""` yields one element.
          # `--wheel --no-build-isolation` is required by the monorepo layout
          # (build needs access to parent directories).
          if ! packages=$(python scripts/published_packages.py); then
            echo "::error ::scripts/published_packages.py failed"
            exit 1
          fi
          if [ -z "$packages" ]; then
            echo "::error ::scripts/published_packages.py returned no packages to build"
            exit 1
          fi
          mapfile -t packages <<<"$packages"

          mkdir -p dist
          for pkg in "${packages[@]}"; do
            echo "Building $pkg..."
            uv build --package "$pkg" --out-dir dist --wheel --no-build-isolation
          done

          echo "Built packages:"
          ls -la dist/

      - name: Publish to PyPI
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
          # PyPI answered 429 part way through the 0.4.1 release, leaving it partially
          # published. Which limiter fires is still unconfirmed, so upload one file at a
          # time with a pause between them rather than one batch `twine upload dist/*`.
          PYPI_UPLOAD_DELAY_SECONDS: '5'
        # --skip-existing keeps a rerun after a partial upload from failing on files already on PyPI.
        # --verbose so a 429 prints the response body and the RateLimit / RateLimit-Policy
        # headers; without it twine reports a bare "Too Many Requests" that names no policy.
        run: |
          shopt -s nullglob
          dists=(dist/*)
          if [ ${#dists[@]} -eq 0 ]; then
            echo "::error ::No distributions found in dist/ to publish"
            exit 1
          fi

          delay="${PYPI_UPLOAD_DELAY_SECONDS:-5}"
          total=${#dists[@]}
          index=0

          for dist in "${dists[@]}"; do
            index=$((index + 1))
            echo "Uploading $index/$total: $(basename "$dist")"
            twine upload --non-interactive --skip-existing --verbose "$dist"
            if [ "$index" -lt "$total" ]; then
              sleep "$delay"
            fi
          done

          echo "Published $total distributions."
