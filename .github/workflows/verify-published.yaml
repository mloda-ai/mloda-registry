name: Weekly Package Verification

on:
  schedule:
    # Run every Monday at 10:00 AM UTC
    - cron: '0 10 * * 1'
  workflow_dispatch:  # Allow manual triggering

permissions:
  contents: read

jobs:
  verify-published:
    runs-on: ubuntu-latest

    steps:
    - name: Set up Python 3.10
      uses: actions/setup-python@v5
      with:
        python-version: "3.10"

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        python -m pip install "uv>=0.12,<0.13"
        uv tool install tox --with tox-uv

    - name: Get latest release version
      id: get_version
      env:
        GH_TOKEN: ${{ github.token }}
        GH_REPO: ${{ github.repository }}
      run: |
        LATEST_TAG=$(gh release view --json tagName -q '.tagName')
        LATEST_VERSION=${LATEST_TAG#v}
        echo "tag=$LATEST_TAG" >> $GITHUB_OUTPUT
        echo "version=$LATEST_VERSION" >> $GITHUB_OUTPUT
        echo "Latest mloda-registry version: $LATEST_VERSION"

    # The published set, tox.ini and verify scripts must describe the release being verified, not main.
    - name: Check out the release under test
      uses: actions/checkout@v4
      with:
        ref: refs/tags/${{ steps.get_version.outputs.tag }}

    - name: Verify published packages (all together)
      env:
        MLODA_REGISTRY_VERSION: ${{ steps.get_version.outputs.version }}
      run: tox -e verify-published
      timeout-minutes: 10

    - name: Verify packages install independently
      if: ${{ !cancelled() && steps.get_version.outcome == 'success' }}
      env:
        MLODA_REGISTRY_VERSION: ${{ steps.get_version.outputs.version }}
      run: tox -e verify-published-independent
      timeout-minutes: 10

    - name: Verify optional dependencies
      if: ${{ !cancelled() && steps.get_version.outcome == 'success' }}
      env:
        MLODA_REGISTRY_VERSION: ${{ steps.get_version.outputs.version }}
      run: tox -e verify-extras
      timeout-minutes: 10

    - name: Verify typed leaf install
      if: ${{ !cancelled() && steps.get_version.outcome == 'success' }}
      env:
        MLODA_REGISTRY_VERSION: ${{ steps.get_version.outputs.version }}
      run: tox -e verify-typed-install
      timeout-minutes: 10
